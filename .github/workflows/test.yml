name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Parse check
        run: for f in Core/*.lua Data/*.lua UI/*.lua; do luajit -bl "$f" > /dev/null || exit 1; done
      - name: Unit tests
        run: luajit tests/run.lua
      - name: UI smoke test (mock WoW API)
        run: luajit tests/smoke.lua .
